app = "finally-trading"
primary_region = "iad"

[build]

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0

[[http_service.checks]]
  grace_period = "10s"
  interval = "15s"
  method = "GET"
  timeout = "5s"
  path = "/api/health"

[[mounts]]
  source = "finally_data"
  destination = "/app/db"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
